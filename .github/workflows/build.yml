name: Build (Windows)

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "**.md"]
  pull_request:
    paths-ignore: ["worker/**", "**.md"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.11.0
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtwebsockets qtpositioning
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DP2P_API_BASE="$env:API_BASE_URL"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist/ModernP2P | Out-Null
          Copy-Item build/src/Release/ModernP2P.exe dist/ModernP2P/
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir qml dist/ModernP2P/ModernP2P.exe
          Compress-Archive -Path dist/ModernP2P -DestinationPath ModernP2P-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ModernP2P-win64
          path: ModernP2P-win64.zip
          if-no-files-found: error
